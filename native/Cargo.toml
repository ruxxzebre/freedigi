[package]
name = "freedigi"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Native FreeDigi controller configuration for Linux and macOS"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
chaiky-egui = { path = "vendor/chaiky-theme", default-features = false, features = ["card", "button", "navigation", "badge", "toggle", "status", "mascot", "empty"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
# This is an I/O-driven desktop UI: whole-program LTO made every final link
# expensive. Keep optimized release code and cache incremental compilation.
lto = false
codegen-units = 16
incremental = true

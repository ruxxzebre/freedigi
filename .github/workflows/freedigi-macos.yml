name: FreeDigi macOS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'ruxxzebre/freedigi' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.0'
      - name: Verify the laptop's Xcode toolchain
        run: xcrun swift --version
      - name: Test, build and ad-hoc sign native FreeDigi
        run: ./native/scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FreeDigi-macos
          path: native/dist/FreeDigi-macos-*.zip
          if-no-files-found: error

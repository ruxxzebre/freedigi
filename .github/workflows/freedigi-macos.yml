name: FreeDigi macOS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'ruxxzebre/freedigi' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Verify the laptop's Xcode toolchain
        run: xcrun swift --version
      - name: Test, build and ad-hoc sign
        run: ./desktop/scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FreeDigi-macos
          path: desktop/dist/FreeDigi-macos-*.zip
          if-no-files-found: error

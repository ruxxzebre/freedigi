name: macOS build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test and package without restricted entitlements
        run: ./scripts/build-mac.sh
      - name: Compile the Xcode app and preview helper
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/check-xcode-architectures.py
          xcodebuild -project ControlLab.xcodeproj -scheme ControlLab -configuration Debug -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
          test -x DerivedData/Build/Products/Debug/ControlLab.app/Contents/MacOS/ControlLabRGBPreview
          test -f DerivedData/Build/Products/Debug/ControlLab.app/Contents/Frameworks/SDL3.framework/SDL3

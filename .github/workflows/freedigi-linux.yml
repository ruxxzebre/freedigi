name: FreeDigi Linux
on:
  push:
    branches: [main]
    paths: ['native/**', 'flake.*', 'rust-toolchain.toml', 'Sources/**', 'Tests/**', 'Package.swift', '.github/workflows/freedigi-linux.yml']
  pull_request:
    paths: ['native/**', 'flake.*', 'rust-toolchain.toml', 'Sources/**', 'Tests/**', 'Package.swift', '.github/workflows/freedigi-linux.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0.3'
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libwayland-client0 libx11-6 libxcursor1 libxi6 libxrandr2 libcurl4-openssl-dev libxml2-dev dpkg-dev desktop-file-utils
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: native-linux-${{ matrix.arch }}-${{ hashFiles('native/Cargo.lock', 'native/Cargo.toml', 'flake.lock', 'rust-toolchain.toml') }}
      - name: Test and package FreeDigi
        run: nix develop --command ./native/scripts/build.sh
      - name: Build Debian package
        run: python3 native/scripts/package-linux.py --archive native/dist/FreeDigi-linux-${{ matrix.arch }}.tar.gz --format deb
      - name: Verify Debian and Ubuntu installation
        run: |
          for distro in debian:trixie-slim ubuntu:24.04; do
            docker run --rm -v "$PWD:/repo:ro" "$distro" bash -c '
              set -e
              apt-get update
              apt-get install -y /repo/native/dist/*.deb python3 desktop-file-utils xvfb xauth libgl1-mesa-dri
              bash /repo/native/scripts/check-linux-install.sh /repo
              apt-get purge -y freedigi
              test ! -e /usr/bin/freedigi
              test ! -e /usr/lib/freedigi/freedigi-service
              test ! -e /usr/lib/udev/rules.d/70-freedigi.rules
            '
          done
      - name: Build and verify Arch package
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm -v "$PWD:/repo:ro" -v "$PWD/native/dist:/out" archlinux:base-devel bash -c '
            set -e
            pacman -Syu --noconfirm python desktop-file-utils xorg-server-xvfb xorg-xauth mesa
            useradd -m builder
            chmod a+w /out
            su builder -c "python /repo/native/scripts/package-linux.py --archive /out/FreeDigi-linux-amd64.tar.gz --format arch --output /out"
            pacman -U --noconfirm /out/*.pkg.tar.zst
            bash /repo/native/scripts/check-linux-install.sh /repo
            pacman -R --noconfirm freedigi
            test ! -e /usr/bin/freedigi
            test ! -e /usr/lib/freedigi/freedigi-service
            test ! -e /usr/lib/udev/rules.d/70-freedigi.rules
          '
      - uses: actions/upload-artifact@v4
        with:
          name: FreeDigi-linux-${{ matrix.arch }}
          path: |
            native/dist/FreeDigi-linux-*.tar.gz
            native/dist/*.deb
            native/dist/*.pkg.tar.zst
          retention-days: 1
          if-no-files-found: error

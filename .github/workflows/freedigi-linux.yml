name: FreeDigi Linux
on:
  push:
    branches: [main]
    paths: ['native/**', 'flake.*', 'rust-toolchain.toml', 'Sources/ControllerProtocol/**', 'Sources/DesktopHID/**', 'Sources/ControlLabService/**', 'Sources/Vader5Core/**', 'Tests/**', 'Package.swift', '.github/workflows/freedigi-linux.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0.3'
      - name: Linux runtime and helper dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1 libxkbcommon0 libwayland-client0 libx11-6 libxcursor1 libxi6 libxrandr2 libcurl4-openssl-dev libxml2-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: native-linux-${{ hashFiles('native/Cargo.lock', 'native/Cargo.toml', 'flake.lock', 'rust-toolchain.toml') }}
      - name: Test and package native FreeDigi
        run: nix develop --command ./native/scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FreeDigi-linux-amd64
          path: native/dist/FreeDigi-linux-amd64.tar.gz
          if-no-files-found: error
